<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glance page</title>
<!--
  one-glance HTML variant. Self-contained, no external files.
  Same order as the glance card: answer, findings, one picture, decision, details.
  Replace the example content. Keep one picture per page.
-->
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --ink:#15202b; --muted:#5b6672; --line:#dde2e8;
    --good:#1f8a52; --warn:#b7770a; --bad:#c23b2e; --accent:#2f6fde; --bar:#9fb3c8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f141a; --surface:#161d25; --ink:#e6edf3; --muted:#93a1b0; --line:#26303b;
    --good:#4cc584; --warn:#e3a63a; --bad:#ef7064; --accent:#6ea0ff; --bar:#3d5166; color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
  main{max-width:760px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:20px}
  .topic{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  h1{margin:4px 0 0;font-size:clamp(22px,4vw,30px);line-height:1.2}
  ul.find{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  ul.find li{display:grid;grid-template-columns:22px 1fr;gap:6px}
  .ok{color:var(--good)} .wa{color:var(--warn)} .no{color:var(--bad)}
  figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  figcaption{font-size:13px;color:var(--muted);margin-bottom:10px}
  .bars{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:14px}
  .track{height:14px;background:var(--line);border-radius:3px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--bar)}
  .row.pick .track i{background:var(--accent)}
  .row.pick{font-weight:600}
  .val{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .you{border:2px solid var(--ink);border-radius:8px;padding:14px 16px;font-weight:600}
  .you span{color:var(--muted);font-weight:400;display:block;font-size:14px;margin-top:4px}
  details{font-size:14px;color:var(--muted)}
  @media (max-width:480px){.row{grid-template-columns:80px 1fr 52px}}
</style>
</head>
<body>
<main>
  <header>
    <div class="topic">Newsletter move</div>
    <h1>Brevo pays off above 20k mails a month.</h1>
  </header>

  <ul class="find">
    <li><span class="ok">✓</span>About 40 % cheaper at your volume</li>
    <li><span class="no">✗</span>No Shopify sync</li>
  </ul>

  <figure>
    <figcaption>Monthly cost at 5,000 contacts</figcaption>
    <div class="bars">
      <div class="row"><span>Mailchimp</span><div class="track"><i style="width:100%"></i></div><span class="val">100 €</span></div>
      <div class="row pick"><span>Brevo</span><div class="track"><i style="width:59%"></i></div><span class="val">59 €</span></div>
      <div class="row"><span>Sendy</span><div class="track"><i style="width:15%"></i></div><span class="val">15 €</span></div>
    </div>
  </figure>

  <div class="you">▶ You: Can you live without the Shopify sync?
    <span>Recommendation: yes, switch to Brevo.</span></div>

  <details><summary>Details</summary>
    <p>Sources, assumptions and the full comparison go here, folded away.</p>
  </details>
</main>
</body>
</html>
